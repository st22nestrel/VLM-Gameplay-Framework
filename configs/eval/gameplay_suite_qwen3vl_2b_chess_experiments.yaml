# Chess screening suite: 7 conditions x 2 models x 2 repeats = 28 games / 1400 ticks.
# Includes the original suite's two per-game baseline configurations unchanged.
# The repeat count is reduced from 3 to 2 for screening; use 3+ for confirmation.
# See docs/chess_experiments.md for comparisons, tuning, and subset commands.
#
# Validate (does not launch the game or load model weights):
# conda run -n transformers5 python -m src.cli.main gameplay-suite --config configs/eval/gameplay_suite_qwen3vl_2b_chess_experiments.yaml --validate-only
# Run: remove --validate-only. --dry-run still loads models and launches the game.

name: qwen3vl_2b_chess_experiments
output_dir: outputs/gameplay-suites

game:
  executable: 'C:\Program Files\Microsoft Games\Chess\chess.exe'
  title: Chess Titans
  args: []
  cwd: null
  post_launch_wait_ms: 5000
  launch_timeout_ms: 20000
  close_timeout_ms: 5000
  terminate_after_close_timeout: true
  focus: true

defaults:
  max_ticks: 50
  overrides:
    target_window:
      hwnd: null
      title_substring: Chess Titans

    capture:
      method: auto
      # Make the original suite's inherited capture settings explicit.
      strategy: after_action
      post_action_settle_ms: 250
      cursor_mode: both
      vlm_image_mode: raw
      output_dir: outputs/captures

    actions:
      config_path: configs/actions/default-actions_chess.yaml
      disable_center_delta_conversion: false

    gameplay:
      backend: transformers
      model: unsloth/Qwen3-VL-2B-Instruct
      max_new_tokens: 64

      model_settings:
        lora_adapter_path: null
        lora_base_model_source: config
        enable_thinking: false
        thinking_budget: null
        normalize_coordinates_from_0_1000: true
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        # Fixed standard sampling is the control for visual/recovery experiments.
        generation_params:
          strategy: "off"

      system_prompt: |
        You are playing Chess Titans as White. Your goal is to win the game.
        You control the white pieces; the computer controls the black pieces.
        Make each move with two clicks across two responses: first select a white piece, then click a legal destination for it on the next screenshot.
        If a white piece is already selected or highlighted, click its legal destination instead of selecting it again.
        Use the latest screenshot to decide whether you are selecting a piece or completing a move.
        Click the center of the intended square.
        Coordinates are integers from 0 to 1000 relative to the entire current game screenshot: top-left is 0 0, bottom-right is 1000 1000.
        Only one action is available: click at x y.
        Your entire response must be exactly one line matching this format: click at <x> <y>
        Do not explain, describe, analyze, use markdown, or mention chess notation.
        Examples: "click at 100 100"

      user_prompt: |
        Look at the current screenshot. If a white piece is selected, click a legal destination for it.
        Otherwise, click a white piece to select it for your next move.
        Return exactly one action: click at <x> <y>

      log_vlm_io: true
      action_hold_duration_ms: null

      # No past assistant replies, action lists, or historical chat screenshots.
      # visual_context below is a separate, single-image comparison mechanism.
      message_history:
        mode: none

      state_context:
        enabled: false

      visual_context:
        mode: "off"

      progress_tracking:
        enabled: true
        region:
          left: 710
          top: 38
          width: 42
          height: 64
        change_threshold: 0.02
        save_debug_crops: true

      delay_ms: 3000
      frame_cadence_ms: 1000
      output_dir: outputs/gameplay-runs
      pause_key: f1
      finish_strategy: ask_user
      finish_keywords:
        - game over
        - level complete
        - mission accomplished
        - finished
        - completed
        - objective complete

execution:
  repeats: 2
  fail_fast: false

debug:
  dump_resolved_gameplay_config: true

# YAML anchors share settings between base/finetuned pairs.
# Every path is relative to the repository root, as in the original suite.
runs:
  # A. Original prompts and standard -> precise -> creative cycle (not random
  # option selection). Ranged values within precise/creative are sampled.
  - name: qwen3vl_2b_base_baseline
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay: &original_gameplay
        system_prompt: |
          You are playing a chess game. Your goal is to win the game. Only one action is available: click at x y.
          Your entire response must be exactly one line matching this format: click at <x> <y>
          Do not explain, describe, analyze, use markdown, or mention chess notation.
          Examples: "click at 100 100"
        user_prompt: |
          Return exactly one action for the current screenshot: click at <x> <y>
        model_settings:
          lora_adapter_path: null
          generation_params: &original_sampling
            strategy: options
            seed: 42
            seed_scope: same_per_suite
            selection: sequential
            value_precision: 3
            key_precision: 3
            usage_summary_top_n: 10
            options:
              - name: standard
                temperature: 1.0
                top_p: 0.95
                top_k: 20
              - name: precise
                temperature: {min: 0.2, max: 0.5}
                top_p: {min: 0.7, max: 0.9}
                top_k: {min: 10, max: 30}
              - name: creative
                temperature: {min: 0.8, max: 1.2}
                top_p: {min: 0.9, max: 1.0}
                top_k: {min: 20, max: 50}

  - name: qwen3vl_2b_finetuned_baseline
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        <<: *original_gameplay
        model_settings:
          # Local adapter weights are gitignored and are not published yet.
          # Without them, select base-model runs; see docs/chess_experiments.md.
          lora_adapter_path: &finetuned_adapter data/models/adapters/qwen3-vl-2b-chess-lora
          generation_params: *original_sampling

  # B vs A: change only the prompts (White, selection/destination, coordinates).
  - name: qwen3vl_2b_base_explicit_mixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings:
          lora_adapter_path: null
          generation_params: *original_sampling

  - name: qwen3vl_2b_finetuned_explicit_mixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings:
          lora_adapter_path: *finetuned_adapter
          generation_params: *original_sampling

  # C vs B: stop changing the decoding distribution between clicks.
  # C is the shared control for D, E, and G.
  - name: qwen3vl_2b_base_explicit_fixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings:
          lora_adapter_path: null

  - name: qwen3vl_2b_finetuned_explicit_fixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings:
          lora_adapter_path: *finetuned_adapter

  # D vs C: compare only the previous/current images, from the second request.
  - name: qwen3vl_2b_base_visual_pair
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        visual_context: &visual_pair
          mode: always_last_2
          # Recent chess captures are 800x496. Keep nearly their full detail;
          # the runtime default of 384 pixels per panel halves that detail.
          panel_width: 768
          label_height: 28
          # Runtime converts output coordinates using the ORIGINAL frame size.
          # There is no automatic mapping from the combined image's coordinates.
          prompt_note: >-
            The attached image contains LEFT/PREVIOUS and RIGHT/CURRENT panels.
            LEFT is the screenshot before the last click; RIGHT is the latest screenshot after it.
            Compare them to see whether a piece was selected, a move completed, or the click had no useful effect.
            Choose your next click in RIGHT/CURRENT.
            Report x y normalized from 0 to 1000 WITHIN THE RIGHT SCREENSHOT ONLY, excluding the label strip.
            The right screenshot's own top-left is 0 0 and its own bottom-right is 1000 1000.
        model_settings:
          lora_adapter_path: null

  - name: qwen3vl_2b_finetuned_visual_pair
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        visual_context: *visual_pair
        model_settings:
          lora_adapter_path: *finetuned_adapter

  # E vs C: recovery text only, triggered by 3 consecutive near-static checks.
  - name: qwen3vl_2b_base_stuck_hint
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        state_context: &chess_recovery
          enabled: true
          # Repetition compares action names, NOT coordinates. All chess clicks
          # have the same name. Keep this above max_ticks to use screen checks.
          repeat_threshold: 999
          screen_change_repeat_threshold: 3
          # Whole-frame grayscale difference at 32x32, rounded to 3 decimals.
          # A provisional tighter threshold than 0.02 for subtle chess changes.
          screen_change_threshold: 0.003
          template: "{stuck_reason} {stuck_hint}"
          stuck_hint: >-
            Check the latest board carefully. If a white piece is selected, complete the move by clicking a legal destination.
            Otherwise, select a movable white piece. If your click made no useful change, choose another square or piece.
            Return one click action in the required format.
        model_settings:
          lora_adapter_path: null

  - name: qwen3vl_2b_finetuned_stuck_hint
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        state_context: *chess_recovery
        model_settings:
          lora_adapter_path: *finetuned_adapter

  # F vs E: add the visual pair only when the SAME stuck detector fires.
  - name: qwen3vl_2b_base_stuck_visual
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        state_context: *chess_recovery
        visual_context: &stuck_visual
          <<: *visual_pair
          mode: on_stuck
        model_settings:
          lora_adapter_path: null

  - name: qwen3vl_2b_finetuned_stuck_visual
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        state_context: *chess_recovery
        visual_context: *stuck_visual
        model_settings:
          lora_adapter_path: *finetuned_adapter

  # G vs C: moderate extra exploration, with no history or recovery intervention.
  - name: qwen3vl_2b_base_exploratory_fixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings: &exploratory_sampling
          lora_adapter_path: null
          temperature: 1.2
          top_p: 0.98
          top_k: 40

  - name: qwen3vl_2b_finetuned_exploratory_fixed
    gameplay_config: configs/runtime/gameplay.yaml
    overrides:
      gameplay:
        model_settings:
          <<: *exploratory_sampling
          lora_adapter_path: *finetuned_adapter
