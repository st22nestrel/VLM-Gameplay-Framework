# Quantized Qwen3.5 9B GGUF with an automatically managed llama-server on PATH.
# Override server_path or local_model_path/local_mmproj_path for your installation.

target_window:
  hwnd: null
  title_substring: Chess Titans
capture:
  method: mss
  cursor_mode: both
  vlm_image_mode: cursor
  output_dir: outputs/chess_titans/captures/
actions:
  config_path: configs/actions/default-actions_chess.yaml
  disable_center_delta_conversion: false
gameplay:
  backend: llama_cpp_server
  model: w-ahmad/Qwen3.5-9B-GGUF-MoQ:MoQ-3.6
  max_new_tokens: 256
  model_settings:
    enable_thinking: false
    normalize_coordinates_from_0_1000: true
    temperature: 0.1
    top_p: 0.8
    top_k: 20
  system_prompt: |
    You are playing Chess Titans as White. Your goal is to win the game.
    You control the white pieces; the computer controls the black pieces.
    Make each move with two clicks across two responses: first select a white piece, then click a legal destination for it on the next screenshot.
    If a white piece is already selected or highlighted, click its legal destination instead of selecting it again.
    Use the latest screenshot to decide whether you are selecting a piece or completing a move.
    Click the center of the intended square.
    Coordinates are integers from 0 to 1000 relative to the entire current game screenshot: top-left is 0 0, bottom-right is 1000 1000.
    Only one action is available: click at x y.
    Your entire response must be exactly one line matching this format: click at <x> <y>
    Do not explain, describe, analyze, use markdown, or mention chess notation.
    Examples: "click at 100 100"
  user_prompt: |
    Look at the current screenshot. If a white piece is selected, click a legal destination for it.
    Otherwise, click a white piece to select it for your next move.
    Return exactly one action: click at <x> <y>
  delay_ms: 3000
  frame_cadence_ms: 1000
  output_dir: outputs/chess_titans/gameplay-runs
  pause_key: f1
  finish_strategy: ask_user
  finish_keywords:
  - game over
  - finished
  - completed
  llama_cpp:
    auto_start: true
    server_path: llama-server
    base_url: http://127.0.0.1:8080/v1
    host: 127.0.0.1
    port: 8080
    startup_timeout_sec: 900
    request_timeout_sec: 300
    hf_repo_id: w-ahmad/Qwen3.5-9B-GGUF-MoQ
    hf_filename: MoQ-Quants-Latest/Qwen3.5-9B-MoQ-3.6.gguf
    hf_mmproj_filename: MoQ-mmproj/mmproj-BF16.gguf
    n_gpu_layers: -1
    ctx_size: 8192
    parallel: 1
    flash_attn: auto
    jinja: true
